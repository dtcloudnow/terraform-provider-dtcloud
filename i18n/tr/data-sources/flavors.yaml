- en: |-
    Lists the compute flavors available for virtual machines.
  tr: |-
    Sanal makineler için kullanılabilir bilişim flavor'larını listeler.
- en: |-
    Use it so a configuration names a size instead of pasting an id. Flavors are defined by the platform operator, so there is no resource for them.
  tr: |-
    Bir yapılandırmanın kimlik yapıştırmak yerine bir boyutu adıyla anması için kullanın. Flavor'ları platform işletmecisi tanımlar; bu yüzden onlar için bir kaynak yoktur.
- en: |-
    The endpoint takes no filters, so `name` is applied by the provider.
  tr: |-
    Uç nokta filtre almaz, bu yüzden `name` sağlayıcı tarafından uygulanır.
- en: |-
    Only return flavors whose name matches exactly. Applied here, not by the API — the endpoint takes no filters, so the full list is fetched either way.
  tr: |-
    Yalnızca adı tam olarak eşleşen flavor'ları döndürür. API tarafından değil burada uygulanır; uç nokta filtre almaz, bu yüzden her durumda tam liste çekilir.
- en: |-
    The flavors that matched.
  tr: |-
    Eşleşen flavor'lar.
- en: |-
    **`name` is applied by the provider.** It matches the whole name, ignoring case. The endpoint takes no filters, so the full list is fetched either way.
  tr: |-
    **`name` sağlayıcı tarafından uygulanır.** Büyük/küçük harfi yok sayarak adın tamamıyla eşleşir. Uç nokta filtre almaz, bu yüzden her durumda tam liste çekilir.
