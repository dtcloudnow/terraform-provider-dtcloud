- en: |-
    dtcloud Provider
  tr: |-
    dtcloud Sağlayıcısı
- en: |-
    Manage DT Cloud (CMP) resources with Terraform: describe the infrastructure you want in a configuration file, run `terraform apply`, and the provider makes the platform match it.
  tr: |-
    DT Cloud (CMP) kaynaklarını Terraform ile yönetin: istediğiniz altyapıyı bir yapılandırma dosyasında tanımlayın, `terraform apply` çalıştırın; sağlayıcı platformu buna uygun hale getirir.
- en: |-
    The provider talks to the DT Cloud API through the [`dt-go`](https://github.com/dtcloudnow/dt-go) SDK -- the same SDK behind the [`dtctl`](https://docs.dtcloudnow.com/dtctl) command-line tool, so both tools see the same API and behave the same way.
  tr: |-
    Sağlayıcı DT Cloud API'siyle [`dt-go`](https://github.com/dtcloudnow/dt-go) SDK'sı üzerinden konuşur. Bu, [`dtctl`](https://docs.dtcloudnow.com/dtctl) komut satırı aracının kullandığı SDK'nın aynısıdır; bu yüzden iki araç da aynı API'yi görür ve aynı şekilde davranır.
- en: |-
    Credentials are prompted for by Terraform: a variable with no default is asked for on every run that does not already have it. Put the values in a gitignored terraform.tfvars, or export DTCLOUD_ACCESS_KEY / DTCLOUD_SECRET_KEY instead.
  tr: |-
    Kimlik bilgilerini Terraform sorar: varsayılanı olmayan bir değişken, değeri henüz verilmemiş her çalıştırmada sorulur. Değerleri git'e girmeyen bir terraform.tfvars dosyasına koyun ya da bunun yerine DTCLOUD_ACCESS_KEY / DTCLOUD_SECRET_KEY ortam değişkenlerini tanımlayın.
- en: |-
    Every request carries an access key and a secret key, and is scoped to one region. The provider takes each of `access_key`, `secret_key`, `api_endpoint` and `region_id` from the first source that supplies it:
  tr: |-
    Her istek bir erişim anahtarı ve bir gizli anahtar taşır ve tek bir bölgeyle sınırlıdır. Sağlayıcı `access_key`, `secret_key`, `api_endpoint` ve `region_id` değerlerinin her birini, onu sağlayan ilk kaynaktan alır:
- en: |-
    **The `provider` block.** Explicit and version-controlled. Never write the secret key as a literal here -- reference a `variable` with no default and Terraform will prompt for it, or put it in a gitignored `terraform.tfvars`.
  tr: |-
    **`provider` bloğu.** Açıktır ve sürüm denetimindedir. Gizli anahtarı burada asla düz metin olarak yazmayın: varsayılanı olmayan bir `variable`'a başvurun, Terraform onu sorar; ya da git'e girmeyen bir `terraform.tfvars` dosyasına koyun.
- en: |-
    **Environment variables** -- `DTCLOUD_ACCESS_KEY`, `DTCLOUD_SECRET_KEY`, `DTCLOUD_API_URL`, `DTCLOUD_REGION_ID`. The right answer in CI: they override the configuration file, so a build agent never silently inherits a developer's account.
  tr: |-
    **Ortam değişkenleri**: `DTCLOUD_ACCESS_KEY`, `DTCLOUD_SECRET_KEY`, `DTCLOUD_API_URL`, `DTCLOUD_REGION_ID`. CI için doğru seçim budur: yapılandırma dosyasını geçersiz kılarlar, böylece bir derleme ajanı bir geliştiricinin hesabını asla sessizce devralmaz.
- en: |-
    **The configuration file.** Anything still unset is read from `config.yaml` in this machine's configuration directory:
  tr: |-
    **Yapılandırma dosyası.** Hâlâ ayarlanmamış olan her şey bu makinenin yapılandırma dizinindeki `config.yaml` dosyasından okunur:
- en: |-
    OS
  tr: |-
