- en: |-
    The file holds a secret key, so it must be owner-readable only. The provider tightens a too-permissive file at its own default path and warns about one elsewhere.
  tr: |-
    Dosya bir gizli anahtar tutar, bu yüzden yalnızca sahibi tarafından okunabilir olmalıdır. Sağlayıcı kendi varsayılan yolundaki fazla izinli bir dosyanın izinlerini daraltır, başka bir yerdeki için uyarı verir.
- en: |-
    The provider binary doubles as its own setup command: `terraform-provider-dtcloud configure` prompts for the four values, verifies them against the API before saving, and writes the file with the right permissions. `-profile prod` writes a second account, selectable with the `profile` argument or `DTCLOUD_PROFILE`.
  tr: |-
    Sağlayıcının çalıştırılabilir dosyası aynı zamanda kendi kurulum komutudur: `terraform-provider-dtcloud configure` dört değeri sorar, kaydetmeden önce onları API'ye karşı doğrular ve dosyayı doğru izinlerle yazar. `-profile prod` ikinci bir hesap yazar; bu hesap `profile` argümanıyla ya da `DTCLOUD_PROFILE` ile seçilir.
- en: |-
    API access key, sent as the x-api-access-key header.
  tr: |-
    API erişim anahtarı; x-api-access-key başlığıyla gönderilir.
- en: |-
    Base URL of the DT Cloud API, ending in /api/v1. Required: it decides which environment resources are created in, and the provider will not guess. Can come from DTCLOUD_API_URL or the configuration file instead.
  tr: |-
    DT Cloud API'sinin /api/v1 ile biten temel URL'si. Ayarlanmazsa SDK'nın varsayılanı kullanılır.
- en: |-
    Path to the configuration file. Defaults to config.yaml in this machine's configuration directory, under terraform-provider-dtcloud.
  tr: |-
    Yapılandırma dosyasının yolu. Varsayılan olarak bu makinenin yapılandırma dizininde, terraform-provider-dtcloud altındaki config.yaml dosyasıdır.
- en: |-
    Which account in the configuration file to use. Defaults to the file's `default_profile`, then to `default`.
  tr: |-
    Yapılandırma dosyasındaki hangi hesabın kullanılacağı. Varsayılan olarak dosyanın `default_profile` değeri, o da yoksa `default` kullanılır.
- en: |-
    Region / server id, sent as the serverId query parameter on every request.
  tr: |-
    Bölge / sunucu kimliği; her istekte serverId sorgu parametresi olarak gönderilir.
- en: |-
    API secret key, sent as the x-api-secret-key header.
  tr: |-
    API gizli anahtarı; x-api-secret-key başlığıyla gönderilir.
